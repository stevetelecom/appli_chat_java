<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d5c4f"/>
      <stop offset="100%" stop-color="#0a4a40"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#25b464"/>
    </linearGradient>
  </defs>

  <!-- Fond arrondi -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Bulle de discussion principale -->
  <path d="M 128 180
           Q 128 140 168 140
           L 344 140
           Q 384 140 384 180
           L 384 288
           Q 384 328 344 328
           L 224 328
           L 168 372
           L 176 328
           L 168 328
           Q 128 328 128 288
           Z"
        fill="url(#bubbleGrad)"/>

  <!-- Points de connexion / reseau a l'interieur de la bulle -->
  <circle cx="196" cy="234" r="12" fill="#ffffff"/>
  <circle cx="256" cy="234" r="12" fill="#ffffff"/>
  <circle cx="316" cy="234" r="12" fill="#ffffff"/>

  <!-- Petit noeud de connexion exterieur (reseau / camarades connectes) -->
  <circle cx="392" cy="368" r="28" fill="#ffffff"/>
  <circle cx="392" cy="368" r="10" fill="#0d5c4f"/>
  <line x1="360" y1="320" x2="380" y2="350" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <circle cx="120" cy="392" r="20" fill="#ffffff" opacity="0.85"/>
  <line x1="150" y1="340" x2="130" y2="378" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
</svg>
